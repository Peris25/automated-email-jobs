{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<form method="POST" class="card shadow-sm p-4 form-card" style="max-width: 380px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h2 class="h4 mb-3">Self-Initiation Admin</h2>
  <label class="form-label">Password</label>
  <input type="password" name="password" class="form-control mb-3" autofocus required>
  <button class="btn btn-danger">Log in</button>
</form>
{% endblock %}

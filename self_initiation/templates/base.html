<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Solvit Valuation{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    h2 { color: navy; }
    .step { font-size: .85rem; color: #6c757d; text-transform: uppercase; letter-spacing: .05em; }
    .form-card { max-width: 640px; margin: auto; }
  </style>
</head>
<body>
  <div class="container py-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="form-card mb-3">
          {% for m in messages %}<div class="alert alert-warning mb-2">{{ m }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>

# Render blueprint for the self-initiation tool, separate from the email portal.
# In Render: New -> Blueprint, and set the blueprint path to self_initiation/render.yaml
services:
  - type: web
    name: solvit-self-initiation
    env: python
    rootDir: self_initiation
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solvit-self-initiation-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SOLVIT_AUTH_URL
        sync: false
      - key: SOLVIT_USERNAME
        sync: false
      - key: SOLVIT_PASSWORD
        sync: false
      - key: SOLVIT_PAYMENT_TYPE
        value: "1"
      - key: GEOPLACES_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRAME_ANCESTORS
        value: "*"

databases:
  - name: solvit-self-initiation-db
    databaseName: self_initiation
